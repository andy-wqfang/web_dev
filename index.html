<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选手抽奖</title>
    <link href="styles/style.css" rel="stylesheet" />
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">BADMINTON · LUCKY DRAW</span>
        <a href="participants.csv" download>下载选手名单 ↗</a>
      </header>
      <section class="intro">
        <p class="kicker">赛场之外，好运登场</p>
        <h1>下一位幸运选手</h1>
        <p>每次随机抽出一位，让好运揭晓。</p>
      </section>
      <section class="draw-card" aria-label="抽奖区域">
        <p id="roster-status" role="status">正在读取选手名单…</p>
        <div class="result" aria-live="polite" aria-atomic="true">
          <span id="winner-number" class="number">—</span>
          <h2 id="winner-name">好运，虚位以待</h2>
          <p id="winner-details">点击下方按钮，揭晓本次幸运选手</p>
        </div>
        <button id="draw-button" type="button" disabled>随机抽取一位 <span aria-hidden="true">↗</span></button>
        <p class="rule">每位选手机会相同 · 每次独立抽取 · 允许重复中奖</p>
      </section>
      <footer>一起挥拍，也一起收获好运。</footer>
    </main>
  </body>
</html>
